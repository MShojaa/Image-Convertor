<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Image Convertor</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The window's own titlebar. It is page content, not chrome: the OS
       one is gone (main.py passes frameless=True), so this is the only one
       there is.

       The left half is what the window drags from, and it is deliberately
       NOT a `pywebview-drag-region`: that moves the window from JavaScript,
       which Windows never hears about, so none of its snapping happens.
       app.js hands the gesture to Windows instead, and puts the class back
       if Windows will not take it. -->
  <div class="titlebar">
    <div class="titlebar-grip">
      <img src="logo.png" class="logo" alt="" width="18" height="18">
      <span class="titlebar-title">Image Convertor</span>
    </div>

    <div class="titlebar-actions">
      <!-- Three choices shown at once rather than one button cycling
           through them: which theme is set, and what the others are, are
           both readable without pressing anything. A radiogroup because
           that is what it is -- one of three, arrow keys move between
           them. -->
      <div id="theme-switcher" class="theme-switcher" role="radiogroup"
           aria-label="Theme">
        <button type="button" class="theme-choice" data-theme-choice="system"
                role="radio" aria-checked="true" title="Follow the system theme">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="2.5" y="4" width="19" height="12.5" rx="1.8"></rect>
            <path d="M9 20.5h6M12 16.5v4"></path>
          </svg>
          <span class="visually-hidden">System</span>
        </button>
        <button type="button" class="theme-choice" data-theme-choice="light"
                role="radio" aria-checked="false" title="Light theme">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3"></path>
            <path d="M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"></path>
          </svg>
          <span class="visually-hidden">Light</span>
        </button>
        <button type="button" class="theme-choice" data-theme-choice="dark"
                role="radio" aria-checked="false" title="Dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 13.5A8.2 8.2 0 1 1 10.5 4a6.6 6.6 0 0 0 9.5 9.5z"></path>
          </svg>
          <span class="visually-hidden">Dark</span>
        </button>
      </div>

      <!-- Minimize, maximize, close, in that order because that is the order
           Windows puts them in and this is a Windows app. Close is last and
           turns red, which is the one piece of colour convention it would be
           perverse to reinvent. -->
      <div class="window-buttons">
        <button type="button" id="window-minimize" class="window-button"
                title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path d="M1.5 6h9"></path>
          </svg>
        </button>
        <button type="button" id="window-maximize" class="window-button"
                title="Maximize" aria-label="Maximize">
          <svg class="icon-maximize" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <rect x="1.5" y="1.5" width="9" height="9" rx="0.5"></rect>
          </svg>
          <svg class="icon-restore" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <rect x="1.5" y="3.5" width="7" height="7" rx="0.5"></rect>
            <path d="M3.5 1.5h7v7"></path>
          </svg>
        </button>
        <button type="button" id="window-close" class="window-button close"
                title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path d="M2 2l8 8M10 2l-8 8"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <main id="app">

    <!-- Side by side when the window is wide enough, stacked when it is
         not. The log lives in its own column so it gets the whole height
         of the window rather than what the controls leave over. -->
    <div class="workspace">
      <div class="controls">
  <!-- One panel, not two: they are the same question asked twice, and a
           heading between them only adds a row of height to say so. -->
      <section class="panel" aria-labelledby="folders-heading">
        <h2 id="folders-heading" class="label">Folders</h2>

        <div class="row">
          <label class="folder-label" for="folder">Read from</label>
          <input type="text" id="folder" class="control grow mono" spellcheck="false"
                 placeholder="No folder chosen">
          <button type="button" id="browse" class="button secondary">Browse</button>
        </div>
        <p id="folder-status" class="hint folder-hint" role="status"></p>

        <div class="row">
          <label class="folder-label" for="output-folder">Write to</label>
          <input type="text" id="output-folder" class="control grow mono" spellcheck="false">
          <button type="button" id="browse-output" class="button secondary">Browse</button>
          <button type="button" id="reset-output" class="button secondary">Default</button>
        </div>
        <p id="output-status" class="hint folder-hint" role="status"></p>
      </section>

      <section class="panel" aria-labelledby="output-heading">
        <h2 id="output-heading" class="label">Output</h2>
        <div class="row">
          <div class="field">
            <label for="size">Resize to</label>
            <input type="text" id="size" class="control mono" placeholder="no resizing"
                   spellcheck="false" aria-describedby="size-hint">
          </div>
          <div class="field">
            <label for="format">Format</label>
            <select id="format" class="control"></select>
          </div>
        </div>
        <p id="size-hint" class="hint">
          Aspect ratio kept, centred on white in the box, never enlarged.
        </p>
        <p id="format-note" class="hint"></p>
      </section>

      <section class="panel" aria-labelledby="effects-heading">
        <h2 id="effects-heading" class="label">Effects</h2>
        <p class="hint">Numbered in the order they are applied.</p>
        <ul id="effects" class="effects"></ul>
        <p id="effect-chain" class="hint chain mono" role="status" aria-live="polite"></p>
      </section>
      </div>

      <section class="panel run" aria-labelledby="run-heading">
        <h2 id="run-heading" class="label">Run</h2>
        <div class="row">
          <button type="button" id="convert" class="button primary">Convert</button>
          <button type="button" id="cancel" class="button secondary" hidden>Cancel</button>
          <button type="button" id="reveal" class="button secondary">Open output folder</button>
          <span id="counter" class="hint mono" role="status" aria-live="polite"></span>
        </div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="0" aria-label="Conversion progress">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="summary" class="summary" role="status" aria-live="polite"></p>
        <div id="log" class="log mono" role="log" aria-label="Conversion log" tabindex="0"></div>
      </section>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
